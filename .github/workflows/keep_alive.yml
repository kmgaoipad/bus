name: Streamlit Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Ping Streamlit with Browser
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            console.log('連線中...');
            await page.goto('https://bfjhhvc9llbapphi4wjcqxt.streamlit.app', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(5000);
            console.log('連線成功，頁面標題:', await page.title());
            await browser.close();
          })();
          "
