name: Keep Streamlit Alive

on:
  schedule:
    # 每天定時喚醒兩次：台灣時間 06:00 (UTC 22:00) 與 12:00 (UTC 04:00)
    - cron: '0 22,4 * * *'
  workflow_dispatch: # 允許手動點擊按鈕立即執行測試

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit and Click Wake Up
        run: |
          python - <<EOF
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print("正在連線至 Streamlit 校車系統...")
              page.goto("https://bfjhhvc9llbapphi4wjcqt.streamlit.app", timeout=60000)
              page.wait_for_timeout(5000)

              # 檢查是否進入休眠狀態並帶有喚醒按鈕
              wake_button = page.locator('text="Yes, get this app back up!"')
              if wake_button.count() > 0:
                  print("檢測到系統休眠中，正在點擊喚醒按鈕...")
                  wake_button.first.click()
                  page.wait_for_timeout(10000)
                  print("已完成點擊喚醒！")
              else:
                  print("系統目前正常運作中，無須喚醒。")

              browser.close()
          EOF
