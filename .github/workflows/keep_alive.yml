name: Keep App Alive

on:
  schedule:
    # 每天每 3 小時自動發送一次 GET 請求
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send GET Request to Streamlit
        run: |
          curl -L -s -o /dev/null -w "%{http_code}\n" "https://bfjhhvc9llbapphi4wjcqxt.streamlit.app"
