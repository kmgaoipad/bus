name: Streamlit Keep Alive

on:
  schedule:
    # 每 10 分鐘執行一次
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Headless Browser Visit
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            console.log('連線至 Streamlit App...');
            await page.goto('https://bfjhhvc9llbapphi4wjcqxt.streamlit.app', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(5000); // 確保 WebSocket 連線建立完畢
            console.log('頁面標題:', await page.title());
            await browser.close();
          })();
          "
